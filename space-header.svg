<svg width="1600" height="350" viewBox="0 0 1600 350"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071a3d"/>
      <stop offset="100%" stop-color="#170b3b"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <style>
      .star {
        fill: #ffffff;
        animation: twinkle 2s infinite alternate;
      }

      .star2 {
        fill: #7df9ff;
        animation: twinkle 3s infinite alternate;
      }

      .planet {
        animation: float 7s ease-in-out infinite;
      }

      .comet {
        animation: fly 8s linear infinite;
      }

      @keyframes twinkle {
        from { opacity: 0.25; }
        to { opacity: 1; }
      }

      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      @keyframes fly {
        0% {
          transform: translate(0,0);
          opacity: 0;
        }
        10% { opacity: 1; }
        70% { opacity: 1; }
        100% {
          transform: translate(500px,250px);
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- SPACE BACKGROUND -->
  <rect width="1600" height="350" fill="url(#space)"/>

  <!-- NEBULA GLOW -->
  <ellipse cx="800" cy="180" rx="500" ry="180"
           fill="url(#glow)" opacity="0.15" filter="url(#blur)"/>

  <!-- STARS -->
  <g>
    <circle class="star" cx="70" cy="60" r="2"/>
    <circle class="star2" cx="150" cy="210" r="2"/>
    <circle class="star" cx="250" cy="90" r="1.5"/>
    <circle class="star2" cx="340" cy="280" r="2"/>
    <circle class="star" cx="430" cy="50" r="2"/>
    <circle class="star2" cx="520" cy="150" r="1.5"/>
    <circle class="star" cx="620" cy="290" r="2"/>
    <circle class="star2" cx="700" cy="70" r="2"/>
    <circle class="star" cx="790" cy="250" r="1.5"/>
    <circle class="star2" cx="890" cy="100" r="2"/>
    <circle class="star" cx="980" cy="300" r="2"/>
    <circle class="star2" cx="1080" cy="60" r="1.5"/>
    <circle class="star" cx="1170" cy="180" r="2"/>
    <circle class="star2" cx="1260" cy="90" r="2"/>
    <circle class="star" cx="1360" cy="270" r="1.5"/>
    <circle class="star2" cx="1460" cy="120" r="2"/>
    <circle class="star" cx="1530" cy="300" r="2"/>
  </g>

  <!-- SMALL STARS -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="110" cy="300" r="1"/>
    <circle cx="190" cy="130" r="1"/>
    <circle cx="300" cy="230" r="1"/>
    <circle cx="390" cy="170" r="1"/>
    <circle cx="480" cy="320" r="1"/>
    <circle cx="570" cy="40" r="1"/>
    <circle cx="670" cy="190" r="1"/>
    <circle cx="750" cy="320" r="1"/>
    <circle cx="850" cy="40" r="1"/>
    <circle cx="940" cy="210" r="1"/>
    <circle cx="1030" cy="150" r="1"/>
    <circle cx="1120" cy="320" r="1"/>
    <circle cx="1210" cy="240" r="1"/>
    <circle cx="1310" cy="40" r="1"/>
    <circle cx="1410" cy="220" r="1"/>
    <circle cx="1500" cy="70" r="1"/>
  </g>

  <!-- PLANET -->
  <g class="planet">
    <circle cx="1330" cy="250" r="48"
            fill="#312e81" opacity="0.9"/>

    <circle cx="1315" cy="235" r="10"
            fill="#4338ca" opacity="0.8"/>

    <circle cx="1345" cy="265" r="15"
            fill="#4f46e5" opacity="0.7"/>

    <ellipse cx="1330" cy="250"
             rx="75" ry="20"
             fill="none"
             stroke="#7df9ff"
             stroke-width="3"
             opacity="0.7"
             transform="rotate(-15 1330 250)"/>
  </g>

  <!-- SMALL PLANET -->
  <g class="planet">
    <circle cx="230" cy="275" r="25"
            fill="#0891b2"
            opacity="0.8"/>

    <ellipse cx="230" cy="275"
             rx="40" ry="10"
             fill="none"
             stroke="#67e8f9"
             stroke-width="2"
             opacity="0.6"/>
  </g>

  <!-- COMET 1 -->
  <g class="comet">
    <line x1="300" y1="40"
          x2="170" y2="120"
          stroke="#7df9ff"
          stroke-width="3"
          opacity="0.6"/>

    <circle cx="300" cy="40"
            r="6"
            fill="#ffffff"/>
  </g>

  <!-- COMET 2 -->
  <g class="comet" style="animation-delay:4s">
    <line x1="900" y1="30"
          x2="780" y2="100"
          stroke="#a78bfa"
          stroke-width="3"
          opacity="0.6"/>

    <circle cx="900" cy="30"
            r="5"
            fill="#ffffff"/>
  </g>

  <!-- ORBIT -->
  <ellipse cx="800" cy="180"
           rx="350"
           ry="120"
           fill="none"
           stroke="#7df9ff"
           stroke-width="1"
           opacity="0.12"/>

</svg>
